<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Furinam-VN</title>
  <style>
    .modal-overlay {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.3);
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-content {
      background: #fff;
      border-radius: 16px;
      padding: 32px 24px;
      min-width: 300px;
      min-height: 120px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.15);
      position: relative;
      text-align: center;
    }
    .close-btn {
      position: absolute;
      top: 12px;
      right: 16px;
      background: none;
      border: none;
      font-size: 1.2em;
      cursor: pointer;
    }
  </style>
</head>
<body style="background-color: white;">
  <nav style="background: #f0f0f0; padding: 30px 0; width: 100%; box-sizing: border-box; position: relative;">
    <a href="#" style="margin-left: 30px; margin-right: 15px; text-decoration: none; color: #333;">Trang chủ</a>
    <a href="#" style="margin-right: 15px; text-decoration: none; color: #333;">Giới thiệu</a>
    <a href="#" style="margin-right: 15px; text-decoration: none; color: #333;">Liên hệ</a>
    <button
      onclick="document.getElementById('modal').classList.add('active')"
      style="position: absolute; right: 30px; top: 50%; transform: translateY(-50%); width: 170px; height: 40px; background: #ddd; border-radius: 8px; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; font-size: 1em;">
        Đăng nhập / Đăng kí
    </button>
  </nav>
  <div id="modal" class="modal-overlay" onclick="if(event.target===this)this.classList.remove('active')">
    <div class="modal-content">
      <button class="close-btn" onclick="document.getElementById('modal').classList.remove('active')">&times;</button>
      <h2>Đăng nhập / Đăng kí</h2>
      <p>Đây là nội dung ô bo góc.</p>
    </div>
  </div>
</body>
</html>
